<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculatrice</title>
</head>
<link rel="stylesheet" href="./calculatrice.css">
<body style="background: white;">
<div class="calc">
  <input type="text" class="ecran" id="ecran" placeholder="x + y">
    <div class="bouton">
      <button id="b1b">1</button>
      <button id="b2b">2</button>
      <button id="b3b">3</button>
      <button id="b4b">4</button>
      <button id="b5b">5</button>
      <button id="b6b">6</button>
      <button id="b7b">7</button>
      <button id="b8b">8</button>
      <button id="b9b">9</button>
      <button id="bbp">+</button>
      <button id="b0b">0</button>
      <button id="bbm">-</button>
      <button id="bbf">*</button>
      <button id="bbd">/</button>
      <button id="eff">effacer</button>
      <button class="bbe" id="bbe">=</button>
    </div>
</div>
    <script src="./calculatrice.js"></script>
</body>
</html>
