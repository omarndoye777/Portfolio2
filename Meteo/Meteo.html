<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteos</title>
    <link rel="stylesheet" href="./Meteo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
    <style>
    
    </style>
</head>
<body>
    <div class="search">
        <h3 class="Meteo">Météo</h3>
        <form id="formulaire" class="formulaire" action="">
          <input id="ville" class="ville" type="text" placeholder="    Ville">
          <button type="submit" id="Loupe" class="Loupe">→</button>
        </form>
    </div>
    <div id="message" class="message"></div>

    <section id="result" class="result-hidden">
      <p class="place" id="place"></p>

      <div class="temperature">
        <span class="temp" id="temp">--</span>
        <span class="temp-unite">°C</span>
      </div>

      <p class="condition" id="condition">—</p>

      <div class="details">
        <div class="detail">
          <span class="detail-label">Ressenti</span>
          <span class="detail-value" id="sensation">--°</span>
        </div>
        <div class="detail">
          <span class="detail-label">Humidité</span>
          <span class="detail-value" id="humidite">--%</span>
        </div>
        <div class="detail">
          <span class="detail-label">Vent</span>
          <span class="detail-value" id="vent">-- km/h</span>
        </div>
      </div>
    </section>
    <script src="./Meteo.js">

    </script>
</body>
</html>
